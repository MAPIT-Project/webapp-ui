# NGINX configuration for MAP-IT Supabase reverse proxy
# Add this to your existing NGINX config

server {
    listen 443 ssl http2;
    server_name new.mapit.work;

    # SSL configuration (you should already have this)
    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;

    # Your main app (already configured)
    location / {
        proxy_pass http://localhost:5173;  # or your SvelteKit port
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase reverse proxy - NEW ADDITION
    location /supabase/ {
        rewrite ^/supabase/(.*) /$1 break;
        proxy_pass http://localhost:54321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Supabase specific headers
        proxy_set_header Connection "";
        proxy_hide_header Upgrade;
        proxy_set_header Authorization "";
        proxy_read_timeout 86400;
    }
}

# Optional: Separate subdomain for Supabase
server {
    listen 443 ssl http2;
    server_name supabase.mapit.work;

    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;

    location / {
        proxy_pass http://localhost:54321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}